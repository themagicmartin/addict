# Demo static server. Widen the CSP per demo only as far as it needs (e.g. wasm, blob: media).
map $uri $cache_control {
  # app.js/app.css keep fixed names across releases, so they must revalidate (ETag) rather than sit in cache for a week.
  ~*\.woff2$ "public, max-age=604800";
  default       "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # All headers live here: an add_header inside a location would drop these.
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Everything is self-hosted. The Docker build splits the game's inline <script>/<style> into
  # /app.js and /app.css, so script-src and style-src stay 'self' (no 'unsafe-inline', no hashes
  # to keep in sync). The one widening is style-src-attr: the UI sets per-item colours through
  # style="color:..;--c:.." attributes (HTML and innerHTML templates). Attributes only: stylesheets
  # and scripts stay locked to 'self'. The game makes no network requests, so connect-src is 'self'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { try_files $uri $uri/ =404; }
}
